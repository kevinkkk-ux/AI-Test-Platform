<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>模拟登录页面</title>
</head>
<body>
    <h2>登录</h2>
    <div>
        用户名：<input type="text" id="txtName">
    </div>
    <div style="margin-top:10px;">
        密码：<input type="password" id="txtPwd">
    </div>
    <div style="margin-top:10px;">
        <button id="btnSubmit">登录</button>
    </div>

<script>
    const btn = document.getElementById('btnSubmit');
    btn.onclick = function(){
        let name = document.getElementById('txtName').value;
        let pwd = document.getElementById('txtPwd').value;
        if(name === "dada" && pwd === "123456"){
            alert("登录成功");
        }else{
            alert("用户名或者密码错误");
        }
    }
</script>
</body>
</html>
